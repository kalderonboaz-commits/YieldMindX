# Data contract for the YieldMindX correlation / yield-prediction pipeline.
#
# This file is the single source of truth for which columns are the target,
# which are excluded as leakage, which are grouping/id columns, and which are
# categorical predictors. All loading/feature code must read this file rather
# than hardcoding column lists.
#
# NOTE ON METHODOLOGY: every exclusion below is justified from statistical /
# domain evidence discovered directly in this dataset (near-1.0 correlation
# with the target, exact duplication, or a derived-ratio check — see
# outputs/reports/eda_report.md). None of it was derived from
# documents/corelation_data_table.docx, which is deliberately kept out of the
# discovery pipeline and used only as a post-hoc validation benchmark
# (see src/validation/benchmark_ground_truth.py).

target: "SortingYield"

# Columns that are the same measurement family as the target (other yield
# rollups) or that were shown to statistically encode the outcome. Never used
# as predictors.
leakage_columns:
  - "Actual Sorting Yield (%)"   # r=0.9875 with target, same underlying metric
  - "LineYield"                  # separate yield-stage output
  - "BackEndYield"               # separate yield-stage output
  - "VIYield"                    # separate yield-stage output
  - "LTYield"                    # separate yield-stage output
  - "TotalYield"                 # r=0.92 with target, rollup that includes it
  - "EstimatedSupplyChipsCount"  # derived ratio to MaskSetSupplyChipsCount correlates r=0.92 with target -> bakes in yield outcome

# Pure identifiers / bookkeeping columns: not physically meaningful process
# parameters, not used as model features. Dates are retained for optional
# drift diagnostics only (see src/eda/profile.py), never as core predictors.
id_columns:
  - "Sorting Date"
  - "FinishLineDate"
  - "LotName"
  - "WaferNum"
  - "Process"              # constant column
  - "FinishLineYear"       # constant column
  - "Exception"            # constant column
  - "MaskSetName_group"    # exact duplicate of MaskSetName (verified 1:1 crosstab)
  - "Sort_WW"
  - "Year_WW"

# Column used to group rows for GroupKFold / GroupShuffleSplit so that a
# given lot's wafers never span both train and validation/test.
group_column: "LotName"

# Categorical predictors, encoded (one-hot / native categorical depending on
# model). Note: Sort_Yield_target[%] is deterministic given Technology
# (verified via crosstab) -- kept as a feature since tree models tolerate
# redundant categoricals, but documented here as non-independent information.
categorical_columns:
  - "VendorName"
  - "Version"
  - "Lot_type"
  - "Customer"
  - "Technology"
  - "MaskSetName"
  - "Sort_Yield_target[%]"

# Everything else numeric in the raw CSV (minus target/leakage/id/categorical
# above) is treated as a candidate process/ET predictor. This is resolved
# programmatically in src/data/load.py rather than listed here (there are
# ~1400 such columns).
