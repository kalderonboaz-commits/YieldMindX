<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>YieldMinx Dashboard Rev 5</title>
  <style>
    :root{--edge:rgba(154,220,235,.34)}*{box-sizing:border-box}body{margin:0;background:#173d70;color:#fff;font-family:Aptos,Arial,sans-serif}
    .stage{min-height:100vh;padding:22px;background:linear-gradient(90deg,rgba(17,64,111,.74),rgba(19,91,137,.37)),url('../assets/yieldmindx-ai-wafer-background-rich.png') center/cover fixed}
    .topline{max-width:1380px;margin:0 auto 12px;display:flex;align-items:center;justify-content:space-between;gap:16px;color:#effbff}.brand{font-size:14px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.tag{border:1px solid var(--edge);border-radius:999px;background:rgba(13,67,113,.75);padding:7px 11px;font-size:12px;color:#d7f2fa}
    .frame-shell{position:relative;max-width:1380px;margin:auto;border:1px solid var(--edge);border-radius:22px;overflow:hidden;box-shadow:0 28px 80px rgba(4,24,54,.45);background:rgba(239,249,252,.15);backdrop-filter:blur(12px)}iframe{position:relative;z-index:0;width:100%;height:2600px;border:0;display:block;background:transparent}
    .header-atmosphere{position:absolute;z-index:1;pointer-events:none;top:28px;left:28px;right:28px;height:214px;border-radius:20px;background:linear-gradient(90deg,rgba(0,88,148,.43),rgba(22,154,198,.22),rgba(44,76,174,.27)),url('../assets/yieldmindx-ai-wafer-background-rich.png') center/cover;mix-blend-mode:screen;opacity:.62}
    .header-wafer{position:absolute;z-index:2;pointer-events:none;top:34px;right:42px;width:390px;height:196px;background:url('../assets/yieldmindx-ai-wafer-background.png') 82% 50%/720px auto no-repeat;opacity:.96;mix-blend-mode:screen;filter:saturate(1.24) brightness(1.18);-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 30%,#000 87%,transparent 100%),linear-gradient(0deg,transparent 0%,#000 20%,#000 90%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0%,#000 30%,#000 87%,transparent 100%),linear-gradient(0deg,transparent 0%,#000 20%,#000 90%,transparent 100%);mask-composite:intersect}
    @media(max-width:760px){.stage{padding:10px;background-attachment:scroll}.topline{padding:4px 6px}.tag{display:none}iframe{height:3300px}.header-atmosphere{top:18px;left:18px;right:18px;height:204px}.header-wafer{top:32px;right:-90px;width:305px;height:165px;opacity:.73}}
  </style>
</head>
<body><div class="stage"><div class="topline"><span class="brand">YieldMindX · AI Yield Intelligence</span><span class="tag">Dashboard template · Rev 5</span></div><div class="frame-shell"><iframe title="YieldMindX dashboard" src="yieldmindx-five-section-workspace-chart-recovery.html"></iframe><div class="header-atmosphere" aria-hidden="true"></div><div class="header-wafer" role="img" aria-label="Integrated 3D silicon wafer illustration"></div></div></div></body>
</html>
