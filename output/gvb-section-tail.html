    const svg=d.getElementById('gvb-scatter'),W=520,H=420,pad=42,absMax=Math.max(...result.out.map(x=>Math.abs(x.d)).filter(Number.isFinite),.1),yMax=Math.max(1.5,...result.out.map(x=>-Math.log10(Math.max(x.q,1e-300))).filter(Number.isFinite));const sx=x=>pad+(x+absMax)/(2*absMax)*(W-2*pad),sy=y=>H-pad-y/yMax*(H-2*pad),threshold=-Math.log10(.05);svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=`<line x1="${pad}" y1="${sy(threshold)}" x2="${W-pad}" y2="${sy(threshold)}" stroke="#d27a34" stroke-dasharray="6 5"/><line x1="${sx(0)}" y1="${pad}" x2="${sx(0)}" y2="${H-pad}" stroke="#adb3c7"/><text x="${W-pad}" y="${sy(threshold)-5}" text-anchor="end" font-size="11" fill="#9b571f">q = .05</text><text x="${pad}" y="${H-10}" font-size="11" fill="#687087">Bad ← Cohen d → Good</text>${result.out.filter(x=>Number.isFinite(x.d)&&Number.isFinite(x.q)).map(x=>`<circle data-parameter="${esc(x.parameter)}" cx="${sx(x.d)}" cy="${sy(-Math.log10(Math.max(x.q,1e-300)))}" r="4" fill="${x.d>=0?'#397ed1':'#dd6b55'}"><title>${esc(x.parameter)} · d=${fmt(x.d)} · q=${fmt(x.q,4)}</title></circle>`).join('')}`;svg.querySelectorAll('circle').forEach(x=>x.onclick=()=>select(x.dataset.parameter));
    const search=d.getElementById('gvb-search'),evidence=d.getElementById('gvb-evidence'),rank=d.getElementById('gvb-rank'),limit=d.getElementById('gvb-limit'),tbody=d.getElementById('gvb-tbody'),shown=d.getElementById('gvb-shown');function drawTable(){let rows=result.out.filter(x=>x.parameter.toLowerCase().includes(search.value.trim().toLowerCase()));if(evidence.value==='q')rows=rows.filter(x=>x.q<.05);if(evidence.value==='p')rows=rows.filter(x=>x.p<.05);const sort=rank.value;rows.sort(sort==='d'?(a,b)=>Math.abs(b.d)-Math.abs(a.d):(a,b)=>a[sort]-b[sort]);if(state.sort&&!['q','p','d'].includes(state.sort)||state.sort!==sort){const key=state.sort;rows.sort((a,b)=>{const av=a[key],bv=b[key];return(typeof av==='string'?av.localeCompare(bv):(av-bv))*state.direction})}const total=rows.length,visible=limit.value==='all'?rows:rows.slice(0,Number(limit.value));tbody.innerHTML=visible.map(x=>`<tr data-parameter="${esc(x.parameter)}"><td title="${esc(x.parameter)}">${esc(x.parameter)}</td><td>${x.ng}/${x.nb}</td><td>${fmt(x.mg)}</td><td>${fmt(x.sg)}</td><td>${fmt(x.mb)}</td><td>${fmt(x.sb)}</td><td>${fmt(x.diff)}</td><td>${fmt(x.lo)} to ${fmt(x.hi)}</td><td>${fmt(x.t)}</td><td>${fmt(x.df,1)}</td><td>${fmt(x.d)}</td><td>${fmt(x.p,4)}</td><td>${fmt(x.q,4)}</td></tr>`).join('');shown.textContent=`Showing ${visible.length} of ${total} matching parameters`;tbody.querySelectorAll('tr').forEach(x=>x.onclick=()=>select(x.dataset.parameter));select(state.selected)}search.oninput=drawTable;evidence.onchange=drawTable;rank.onchange=()=>{state.sort=rank.value;state.direction=1;drawTable()};limit.onchange=drawTable;d.querySelectorAll('.gvb-table th').forEach(th=>th.onclick=()=>{const key=th.dataset.sort;state.direction=state.sort===key?-state.direction:1;state.sort=key;drawTable()});d.getElementById('gvb-download').onclick=()=>download(result.out);drawTable();select(state.selected);results.scrollIntoView({behavior:'smooth',block:'start'});
  }
  run.addEventListener('click',async()=>{if(!input.files[0]||!fixed?.csv)return;run.disabled=true;results.hidden=true;results.innerHTML='';fileStatus.className='save';try{setStage(1);await yieldUi();const gvb=csv(await input.files[0].text());setStage(2);await yieldUi();keyed(gvb,'GVB CSV');setStage(3);await yieldUi();const parameters=csv(fixed.csv);setStage(4);await yieldUi();const analysis=analyse(gvb,parameters);setStage(5);await yieldUi();render(analysis);setStage(6);fileStatus.textContent='Analysis complete. Results are shown below.'}catch(error){progress.hidden=true;results.hidden=false;results.innerHTML=`<p class="gvb-error" role="alert">${esc(error.message||'Analysis could not be completed.')}</p>`;fileStatus.textContent='Analysis stopped. Review the message below.'}finally{run.disabled=false}});
})();
